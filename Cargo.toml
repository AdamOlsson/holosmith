[workspace]
members = ["crates/holosmith"]
resolver = "3"

[workspace.package]
# A placeholder, and deliberately not the version. `VERSION` at the repository root is the one copy of that, and
# `build.rs` reads it into `holosmith::VERSION`. Cargo's manifest needs a version of its own; a real one here would
# be a second answer to the same question, and because it lands in `Cargo.lock` it would move the lock's digest on
# every bump — which is what `scripts/check-crate-set.sh` compares against the crate set this project's image vendors.
version = "0.0.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
shlex = "2"
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
include_dir = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
