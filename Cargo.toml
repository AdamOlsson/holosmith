[workspace]
members = ["crates/holosmith"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }
shlex = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
include_dir = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
